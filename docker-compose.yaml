version: '3.8'

services:
  # -----------------------------------------------------------
  # 1. DATABASE CONDIVISO (MySQL)
  # -----------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: mysql_container
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # -----------------------------------------------------------
  # 2. USER MANAGER
  # -----------------------------------------------------------
  user-manager:
    build:
      context: .
      dockerfile: user-manager/Dockerfile
    container_name: user_manager
    ports:
      - "5002:5000"
      - "50051:50051"
    depends_on:
      - db
    environment:
      - FLASK_APP=main.py
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root_password
      - DB_NAME=user_db
      - GRPC_PORT=50051

  # -----------------------------------------------------------
  # 3. DATA COLLECTOR
  # -----------------------------------------------------------
  data-collector:
    build:
      context: .
      dockerfile: data-collector/Dockerfile
    container_name: data_collector
    ports:
      - "5001:5000"
    depends_on:
      - db
      - user-manager
    environment:
      - FLASK_APP=main.py
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root_password
      - DB_NAME=data_db
      - USER_MANAGER_HOST=user-manager
      - USER_MANAGER_GRPC_PORT=50051

volumes:
  db_data: